name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.6'
          cache: true
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test -shuffle=on -count=1 ./...
      - name: Vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o ${{ runner.temp }}/bridge-map-diff${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/bridge-map-diff
